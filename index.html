
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="自作Webサイトへのリンクをまとめたポータルサイト">

  <title>つぶぐみ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    /* =========================
       基本設定・背景画像
    ========================= */

    :root {
      --accent: #8bb7e8;
      --text: #f5f7fa;
      --sub-text: #b4c0d1;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", "Noto Sans JP", sans-serif;

      color: var(--text);

      /* 背景画像の設定 */
      background:
        linear-gradient(
          rgba(10, 18, 32, 0.78),
          rgba(10, 18, 32, 0.88)
        ),
        url("images/background.jpg");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    /* =========================
       ヘッダー
    ========================= */

    header {
      text-align: center;
      padding: 75px 20px 45px;
    }

    header h1 {
      font-size: clamp(30px, 6vw, 48px);
      letter-spacing: 3px;
      margin: 0 0 15px;
    }

    header p {
      color: #c0ccdc;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .header-line {
      width: 55px;
      height: 3px;
      background: var(--accent);
      margin: 25px auto 0;
      border-radius: 10px;
    }

    /* =========================
       メインコンテンツ
    ========================= */

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 25px 70px;
    }

    /* カテゴリー移動ボタン */

    .category-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 55px;
    }

    .category-nav a {
      color: white;
      text-decoration: none;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 30px;

      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.2);

      transition: 0.2s;
    }

    .category-nav a:hover {
      background: rgba(139,183,232,0.3);
      border-color: var(--accent);
    }

    /* =========================
       カテゴリー
    ========================= */

    .category-section {
      margin-bottom: 55px;
      scroll-margin-top: 25px;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 22px;
      padding-left: 13px;
      border-left: 4px solid var(--accent);
    }

    /* =========================
       サイトカード一覧
    ========================= */

    .site-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .site-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;

      color: white;
      text-decoration: none;

      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 15px;

      background: rgba(255,255,255,0.09);
      backdrop-filter: blur(10px);

      transition:
        transform 0.25s,
        background 0.25s,
        border-color 0.25s;
    }

    .site-card:hover {
      transform: translateY(-6px);
      background: rgba(255,255,255,0.16);
      border-color: var(--accent);
    }

    /* サムネイル */

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s;
    }

    .site-card:hover .thumbnail img {
      transform: scale(1.05);
    }

    /* カード内の文字 */

    .card-content {
      padding: 19px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .site-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    .site-description {
      color: var(--sub-text);
      font-size: 13px;
      line-height: 1.7;
      flex-grow: 1;
    }

    .site-open {
      color: var(--accent);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 18px;
      text-align: right;
    }

    /* =========================
       フッター
    ========================= */

    footer {
      text-align: center;
      padding: 25px;
      color: #a0adbf;
      font-size: 11px;
      letter-spacing: 1px;
      border-top: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.15);
    }

    /* =========================
       スマートフォン対応
    ========================= */

    @media (max-width: 750px) {
      header {
        padding-top: 55px;
      }

      .site-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 13px;
      }

      .card-content {
        padding: 14px;
      }

      .site-name {
        font-size: 15px;
      }

      .site-description {
        font-size: 12px;
      }

      .category-nav {
        gap: 8px;
      }

      .category-nav a {
        padding: 9px 14px;
      }

      body {
        background-attachment: scroll;
      }
    }

    @media (max-width: 430px) {
      .site-grid {
        grid-template-columns: 1fr;
      }

      .site-card {
        display: grid;
        grid-template-columns: 42% 58%;
        min-height: 125px;
      }

      .thumbnail {
        height: 100%;
        aspect-ratio: auto;
      }

      .card-content {
        padding: 15px;
      }

      .site-open {
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->

  <header>
    <h1>つぶぐみ</h1>
    <p>つぶぐみのWebサイトをまとめたポータル</p>
    <div class="header-line"></div>
  </header>

  <main>

    <!-- カテゴリー移動ボタン -->

    <nav class="category-nav" id="categoryNav">
    </nav>

    <!-- サイト一覧 -->

    <div id="siteContainer">
    </div>

  </main>

  <footer>
    TSUBUGUMI © 2026
  </footer>

  <script>

    // =====================================
    // サイト情報の設定
    // =====================================

    const sites = [

      // ツールカテゴリー
      {
        category: "TOOLS",
        name: "つぶ卓,
        description: "○と△だけで、もっと手軽に。",
        url: "https://neo-tubutaku-production.up.railway.app/",
        thumbnail: "tsubutaku.jpg"
      },
    
      {
        category: "TOOLS",
        name: "Youtubu,
        description: "すべての記憶がここに。",
        url: "https://youtubu.yuzuki257yyy257.workers.dev/",
        thumbnail: "youtubu.jpg"
      },
      
      // ゲームカテゴリー
      {
        category: "GAME",
        name: "つぶバトラー",
        description: "つぶぐみオリジナル1vs1カードゲーム",
        url: "https://ccfolia.com/rooms/op8u7j5ZG",
        thumbnail: "tububato.jpg"
      },

      {
        category: "GAME",
        name: "白雪姫のアップルーレット",
        description: "5〜8人",
        url: "https://ccfolia.com/rooms/7LxPp7FIr",
        thumbnail: "apple.jpg"
      },

      // その他カテゴリー
      {
        category: "OTHER",
        name: "Tubook",
        description: "探索者たちの記録を、みんなで。",
        url: "https://tubook.web.app/",
        thumbnail: "tubook.jpg"
      }

    ];


    // =====================================
    // カテゴリーの設定
    // =====================================

    const categories = [
      "TOOLS",
      "GAME",
      "OTHER"
    ];


    // =====================================
    // カテゴリーIDの生成
    // =====================================

    function getCategoryId(category) {
      return "category-" + category
        .toLowerCase()
        .replace(/[^a-z0-9_-]/g, "-");
    }


    // =====================================
    // カテゴリー移動ボタンの生成
    // =====================================

    const categoryNav =
      document.getElementById("categoryNav");

    categories.forEach(category => {

      const link = document.createElement("a");

      link.href = "#" + getCategoryId(category);
      link.textContent = category;

      categoryNav.appendChild(link);

    });


    // =====================================
    // カテゴリー別のサイト表示
    // =====================================

    const siteContainer =
      document.getElementById("siteContainer");

    categories.forEach(category => {

      // 該当カテゴリーのサイトを取得
      const categorySites = sites.filter(
        site => site.category === category
      );

      // サイトがないカテゴリーは表示しない
      if (categorySites.length === 0) return;

      // カテゴリー全体
      const section = document.createElement("section");

      section.className = "category-section";
      section.id = getCategoryId(category);

      // カテゴリー見出し
      const title = document.createElement("h2");

      title.className = "section-title";
      title.textContent = category;

      section.appendChild(title);

      // カード一覧
      const grid = document.createElement("div");

      grid.className = "site-grid";

      categorySites.forEach(site => {

        // カード本体
        const card = document.createElement("a");

        card.className = "site-card";
        card.href = site.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";

        // サムネイル
        const thumbnail = document.createElement("div");

        thumbnail.className = "thumbnail";

        const img = document.createElement("img");

        img.src = site.thumbnail;
        img.alt = site.name + "のサムネイル";
        img.loading = "lazy";

        // 画像が読み込めない場合
        img.addEventListener("error", () => {
          thumbnail.style.display = "none";
        });

        thumbnail.appendChild(img);

        // カード内の文字
        const content = document.createElement("div");

        content.className = "card-content";

        const name = document.createElement("div");

        name.className = "site-name";
        name.textContent = site.name;

        const description = document.createElement("div");

        description.className = "site-description";
        description.textContent = site.description;

        const open = document.createElement("div");

        open.className = "site-open";
        open.textContent = "OPEN ↗";

        content.append(
          name,
          description,
          open
        );

        card.append(
          thumbnail,
          content
        );

        grid.appendChild(card);

      });

      section.appendChild(grid);

      siteContainer.appendChild(section);

    });

  </script>

</body>
</html>
